kind = "mobile"
previewPath = "/"
title = "MediaFlow"
description = "A polished Android media app for discovering approved video content, opening shared media links, managing safe downloads, and playing audio in the background."
version = "1.0.0"
id = "artifacts/media-flow"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23498

[services.development]
run = "pnpm --filter @workspace/media-flow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/media-flow", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/media-flow", "run", "serve" ]

[services.env]
PORT = "23498"
BASE_PATH = "/"
